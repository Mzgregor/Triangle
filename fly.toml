# fly.toml app configuration file for le-triangle-mellow-sunrise-9260

app = 'le-triangle-mellow-sunrise-9260'
primary_region = 'cdg'

[build]

[env]
  PORT = '3000'
  NODE_ENV = 'production'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[mounts]]
  source = 'triangle_data'
  destination = '/data'
  initial_size = '1gb'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1