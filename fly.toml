# fly.toml - Configuration Fly.io pour Le Triangle
app = 'le-triangle'
primary_region = 'cdg'  # Paris datacenter

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '3000'
  NODE_ENV = 'production'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = 'triangle_data'
  destination = '/data'
  initial_size = '1gb'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
